# Full Vela stack on one machine.
#
#   cp .env.example .env      # fill in secrets (and R2 credentials for production)
#   docker compose up -d --build
#
# Dashboard + API: http://localhost:4000   Playback: http://localhost:4100
# RTMP ingest: rtmp://localhost:1935/live   SRT: srt://localhost:8890
#
# Local storage uses Garage (https://garagehq.deuxfleurs.fr), a self-hosted S3-compatible store:
# S3 API on http://localhost:3900 (region "garage"). garage-init creates the layout, the bucket
# and imports the access key from .env on every start (idempotent).
# Production: use Cloudflare R2 or AWS S3. Set the S3_* values in .env and start without Garage:
#   docker compose up -d --build --scale garage=0 --scale garage-init=0

x-vela: &vela
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    # required: false so the stack still starts with --scale garage-init=0 (R2 / S3).
    garage-init: { condition: service_completed_successfully, required: false }
  # Lets containers reach services on the host (test media, webhook receivers). Docker Desktop
  # provides this name already; on Linux it needs the host-gateway mapping.
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: &vela-env
    DATABASE_URL: postgres://vela:${POSTGRES_PASSWORD:-vela}@postgres:5432/vela
    REDIS_URL: redis://redis:6379
    MEDIAMTX_HLS_URL: http://mediamtx:8888
    MEDIAMTX_RTMP_URL: rtmp://mediamtx:1935

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vela}
      POSTGRES_DB: vela
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vela"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Local S3-compatible storage (Garage). Not needed when using Cloudflare R2 / AWS S3.
  # Only the S3 API (3900) is published; RPC (3901) and admin (3903) stay on the compose network.
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env (openssl rand -base64 32)}
    volumes:
      - ./infra/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports: ["3900:3900"]
    healthcheck:
      # The image has no shell; the garage binary itself is the probe.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot bootstrap: layout, bucket, access key, permissions. Safe to re-run.
  garage-init:
    image: node:22-alpine
    restart: "no"
    depends_on:
      garage: { condition: service_healthy }
    command: ["node", "/garage-init.mjs"]
    volumes: ["./infra/garage-init.mjs:/garage-init.mjs:ro"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_BUCKET: ${S3_BUCKET:-vela}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://api:4000/internal/mediamtx/auth?secret=${INTERNAL_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      VELA_API_URL: http://api:4000
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
      - ./infra/mediamtx-hook.sh:/hooks/hook.sh:ro
      - recordings:/recordings
    ports:
      - "1935:1935" # RTMP
      - "8890:8890/udp" # SRT

  api:
    <<: *vela
    build: { context: ., target: api }
    ports: ["4000:4000"]

  worker:
    <<: *vela
    build: { context: ., target: worker }
    volumes:
      - recordings:/recordings
      - work:/work
    # Run several workers (or put them on separate GPU/CPU boxes) to encode in parallel:
    # docker compose up -d --scale worker=3

  stream:
    <<: *vela
    build: { context: ., target: stream }
    ports: ["4100:4100"]

volumes:
  pgdata:
  redisdata:
  garage-meta:
  garage-data:
  recordings:
  work:
