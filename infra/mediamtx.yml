# MediaMTX: RTMP/SRT ingest → low-latency HLS + fMP4 recording.
# Vela decides who may publish (authHTTPAddress → API) and reacts to lifecycle hooks.
logLevel: info

api: yes
apiAddress: :9997
metrics: no

rtsp: no
webrtc: no
moq: no

rtmp: yes
rtmpAddress: :1935

srt: yes
srtAddress: :8890

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: yes
hlsAllowOrigins: ["*"]

# Auth is delegated to the Vela API. The address (with its secret) is set via the
# MTX_AUTHHTTPADDRESS environment variable in docker-compose.
authMethod: http
authHTTPExclude: []

pathDefaults:
  record: yes
  # %z (UTC offset) keeps segment names unique across DST switches. The hook URL-encodes the
  # path because the offset contains "+".
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f_%z
  recordFormat: fmp4
  recordSegmentDuration: 30s
  recordDeleteAfter: 6h

paths:
  "~^live/.+$":
    # Event names sent to the API stay "ready"/"not_ready"; only the MediaMTX keys were renamed.
    runOnAvailable: /hooks/hook.sh ready
    runOnAvailableRestart: no
    runOnUnavailable: /hooks/hook.sh not_ready
    runOnRecordSegmentComplete: /hooks/hook.sh segment
